name: english_master_bd
description: "English Master BD - Offline English learning app for Bangla speakers."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Offline translation and OCR (Google ML Kit, free, on-device)
  google_mlkit_translation: ^0.13.1
  google_mlkit_text_recognition: ^0.15.0

  # Camera and gallery
  image_picker: ^1.2.1

  # Local database (SQLite)
  sqflite: ^2.4.2
  path: ^1.9.1

  # Pronunciation (text to speech)
  flutter_tts: ^4.2.5

  # App state and settings
  provider: ^6.1.5+1
  shared_preferences: ^2.5.4

  # Bangla and English interface
  intl: ^0.20.2

  # Learning progress charts
  fl_chart: ^1.1.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/data/
