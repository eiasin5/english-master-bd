
name: Build English Master BD APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable

      - name: Create Android project files
        run: flutter create --platforms=android .
      - name: Copy Flutter app code
        run: |
          mkdir -p lib
          cp Lib/lib/main.dart lib/main.dart
      - name: Prepare assets folder
        run: mkdir -p assets/data && touch assets/data/.gitkeep

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: English-Master-BD-APK
          path: build/app/outputs/flutter-apk/app-release.apk
