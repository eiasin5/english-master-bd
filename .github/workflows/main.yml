
name: Build English Master BD APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        run: flutter create --platforms=android .
      - name: Copy Flutter app code
        run: |
          SOURCE_FILE=$(find . -type f -iname "main.dart" ! -path "./lib/main.dart" ! -path "./.git/*" | head -n 1)

          if [ -z "$SOURCE_FILE" ]; then
            echo "ERROR: Original main.dart not found"
            find . -maxdepth 5 -type f
            exit 1
          fi

          echo "Found source file: $SOURCE_FILE"
          mkdir -p lib
          cp "$SOURCE_FILE" lib/main.dart
      - name: Prepare assets folder
        run: mkdir -p assets/data && touch assets/data/.gitkeep

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: English-Master-BD-APK
          path: build/app/outputs/flutter-apk/app-release.apk
